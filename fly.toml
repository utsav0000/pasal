app = "pasal"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "pasal_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
