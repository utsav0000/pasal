services:
  - type: web
    name: pasal
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node --disable-warning=ExperimentalWarning server/index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: true
      - key: ENABLE_DEV_TOOLS
        value: false
